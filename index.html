<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>테가키카타 · Tegakikata</title>

    <!-- 모바일 "홈 화면에 추가" 설치(PWA) 관련 태그. manifest.webmanifest 자체는
         vite-plugin-pwa가 빌드 시 자동으로 주입한다(vite.config.ts 참고). -->
    <meta name="theme-color" content="#f2efe3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="테가키카타" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      kanjicanvas는 npm 패키지가 아닌 순수 클라이언트 스크립트라 정적 파일로 직접 로드한다.
      원본: https://github.com/asdfjkl/kanjicanvas (public/vendor/kanjicanvas/ 아래 복사됨)
      ref-patterns.js가 window.KanjiCanvas를 참조하므로 kanji-canvas.min.js보다 반드시 뒤에 와야 한다.
    -->
    <!-- Google Identity Services — Drive OAuth 토큰 발급용 -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="/vendor/kanjicanvas/kanji-canvas.min.js"></script>
    <script src="/vendor/kanjicanvas/ref-patterns.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
